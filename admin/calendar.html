<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Calendar — Luna Bistro Console</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%238B5E3C'/><circle cx='22' cy='13' r='11' fill='%23FFFDF8'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/site.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body data-page="calendar">
<a class="skip-link" href="#page">Skip to content</a>
<div class="app">
  <aside class="sidebar" aria-label="Console navigation"></aside>
  <div class="main">
    <header class="topbar"></header>
    <div class="page" id="page">
      <article class="card panel">
        <div class="cal-head">
          <button class="icon-btn" id="cal-prev" aria-label="Previous period"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
          <button class="icon-btn" id="cal-next" aria-label="Next period"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
          <span class="cal-title" id="cal-title"></span>
          <div class="grow"></div>
          <button class="btn btn-ghost btn-sm" id="cal-today">Today</button>
          <div class="seg" id="cal-views" role="group" aria-label="Calendar view">
            <button data-view="day" aria-pressed="false">Day</button>
            <button data-view="week" aria-pressed="false">Week</button>
            <button data-view="month" aria-pressed="true">Month</button>
          </div>
        </div>
        <div id="cal-body"></div>
      </article>
    </div>
  </div>
</div>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/admin.js"></script>
</body>
</html>
