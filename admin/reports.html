<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Reports — Luna Bistro Console</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%238B5E3C'/><circle cx='22' cy='13' r='11' fill='%23FFFDF8'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/site.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body data-page="reports">
<a class="skip-link" href="#page">Skip to content</a>
<div class="app">
  <aside class="sidebar" aria-label="Console navigation"></aside>
  <div class="main">
    <header class="topbar"></header>
    <div class="page" id="page">
      <div class="panel-head" style="margin-bottom:var(--s4)">
        <h2 style="margin:0">Performance</h2>
        <button class="btn btn-ghost btn-sm" id="r-print">Print report</button>
      </div>

      <section class="kpi-grid" id="report-kpis" style="margin-bottom:var(--s5)"></section>

      <section class="grid-half" style="margin-bottom:var(--s5)">
        <article class="card panel"><div class="panel-head"><h3>Daily reservations, 30 days</h3></div><div class="chart-wrap"><canvas id="r-daily"></canvas></div></article>
        <article class="card panel"><div class="panel-head"><h3>Weekly revenue</h3></div><div class="chart-wrap"><canvas id="r-weekly"></canvas></div></article>
      </section>

      <section class="grid-half" style="margin-bottom:var(--s5)">
        <article class="card panel"><div class="panel-head"><h3>Monthly revenue trend</h3></div><div class="chart-wrap"><canvas id="r-monthly"></canvas></div></article>
        <article class="card panel"><div class="panel-head"><h3>Peak hours by covers</h3></div><div class="chart-wrap"><canvas id="r-hours"></canvas></div></article>
      </section>

      <section class="grid-thirds" style="margin-bottom:var(--s5)">
        <article class="card panel"><div class="panel-head"><h3>Average guests per booking</h3></div><div class="chart-wrap"><canvas id="r-guests"></canvas></div></article>
        <article class="card panel"><div class="panel-head"><h3>Reservation sources</h3></div><div class="chart-wrap"><canvas id="r-sources"></canvas></div></article>
        <article class="card panel"><div class="panel-head"><h3>Table demand</h3></div><div class="chart-wrap"><canvas id="r-tables"></canvas></div></article>
      </section>

      <article class="card panel">
        <div class="panel-head"><h3>Popular menu categories</h3><span class="hint" style="margin:0">Orders across the last 30 days</span></div>
        <div class="chart-wrap tall"><canvas id="r-categories"></canvas></div>
      </article>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/admin.js"></script>
</body>
</html>
