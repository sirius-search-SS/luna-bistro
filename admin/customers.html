<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Customers — Luna Bistro Console</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%238B5E3C'/><circle cx='22' cy='13' r='11' fill='%23FFFDF8'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/site.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body data-page="customers">
<a class="skip-link" href="#page">Skip to content</a>
<div class="app">
  <aside class="sidebar" aria-label="Console navigation"></aside>
  <div class="main">
    <header class="topbar"></header>
    <div class="page" id="page">
      <article class="card panel">
        <div class="toolbar">
          <div class="search-box">
            <label class="sr-only" for="c-q">Search guests</label>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input class="control" id="c-q" type="search" placeholder="Name, email or phone" style="width:240px">
          </div>
          <label class="sr-only" for="c-sort">Sort guests</label>
          <select class="control" id="c-sort">
            <option value="visits">Most visits first</option>
            <option value="points">Most loyalty points</option>
            <option value="name">Name, A to Z</option>
          </select>
          <div class="grow"></div>
          <span class="hint" id="cust-count" style="margin:0"></span>
        </div>
        <div class="cust-grid" id="cust-grid"></div>
      </article>
    </div>
  </div>
</div>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/admin.js"></script>
</body>
</html>
