<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Dashboard — Luna Bistro Console</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%238B5E3C'/><circle cx='22' cy='13' r='11' fill='%23FFFDF8'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/site.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body data-page="dashboard">
<a class="skip-link" href="#page">Skip to content</a>
<div class="app">
  <aside class="sidebar" aria-label="Console navigation"></aside>
  <div class="main">
    <header class="topbar"></header>
    <div class="page" id="page">
      <section class="kpi-grid" id="kpis" style="margin-bottom:var(--s5)"></section>

      <section class="grid-dash" style="margin-bottom:var(--s5)">
        <article class="card panel">
          <div class="panel-head"><h2>Reservations, last 14 days</h2><span class="badge badge-muted badge-plain">Bookings per day</span></div>
          <div class="chart-wrap"><canvas id="chart-week"></canvas></div>
        </article>
        <article class="card panel">
          <div class="panel-head"><h2>Busiest service times</h2></div>
          <div class="chart-wrap"><canvas id="chart-hours"></canvas></div>
        </article>
      </section>

      <section class="grid-dash" style="margin-bottom:var(--s5)">
        <article class="card panel">
          <div class="panel-head"><h2>Revenue, last 14 days</h2></div>
          <div class="chart-wrap"><canvas id="chart-revenue"></canvas></div>
        </article>
        <article class="card panel">
          <div class="panel-head"><h2>Most requested tables</h2></div>
          <div class="chart-wrap"><canvas id="chart-tables"></canvas></div>
        </article>
      </section>

      <section class="grid-dash">
        <article class="card panel">
          <div class="panel-head"><h2>Next in the book</h2><a class="btn btn-ghost btn-sm" href="reservations.html">Open reservations</a></div>
          <div class="table-scroll">
            <table class="data">
              <thead><tr><th>Guest</th><th>Guests</th><th>When</th><th>Table</th><th>Status</th></tr></thead>
              <tbody id="upcoming"></tbody>
            </table>
          </div>
        </article>
        <article class="card panel">
          <div class="panel-head"><h2>Recent activity</h2></div>
          <ul class="feed" id="activity"></ul>
        </article>
      </section>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/admin.js"></script>
</body>
</html>
