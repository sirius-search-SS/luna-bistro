<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Reservations — Luna Bistro Console</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%238B5E3C'/><circle cx='22' cy='13' r='11' fill='%23FFFDF8'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/site.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body data-page="reservations">
<a class="skip-link" href="#page">Skip to content</a>
<div class="app">
  <aside class="sidebar" aria-label="Console navigation"></aside>
  <div class="main">
    <header class="topbar"></header>
    <div class="page" id="page">
      <article class="card panel">
        <div class="toolbar" id="res-toolbar"></div>
        <p class="hint" id="res-count" aria-live="polite" style="margin-top:0"></p>
        <div class="table-scroll">
          <table class="data" id="res-table">
            <thead>
              <tr>
                <th data-sort="name">Customer</th>
                <th data-sort="guests">Guests</th>
                <th data-sort="date" aria-sort="ascending">Date</th>
                <th>Time</th>
                <th>Table</th>
                <th data-sort="status">Status</th>
                <th><span class="sr-only">Actions</span></th>
              </tr>
            </thead>
            <tbody id="res-body"></tbody>
          </table>
        </div>
        <div class="pager">
          <span class="hint" style="margin:0">Click any row to open the booking.</span>
          <div class="pager-btns" id="res-pager"></div>
        </div>
      </article>
    </div>
  </div>
</div>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/admin.js"></script>
</body>
</html>
